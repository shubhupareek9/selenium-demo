name: Selenium Tests

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Install Chrome
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # 4. Run tests
      - name: Run Tests
        run: mvn clean test

      # 5. DEBUG: check if allure-results is created
      - name: Debug Allure Results
        run: |
          echo "Checking allure-results folder..."
          ls -R target/allure-results || echo "NO ALLURE RESULTS FOUND"

      # 6. Install Allure CLI (FIXED WAY)
      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz
          echo "$PWD/allure-2.27.0/bin" >> $GITHUB_PATH
          allure --version

      # 7. Generate Allure Report + verify output
      - name: Generate Allure Report
        run: |
          allure generate target/allure-results -o allure-report --clean
          echo "Checking allure-report folder..."
          ls -R allure-report

      # 8. Upload HTML report
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # 9. Upload raw results
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
